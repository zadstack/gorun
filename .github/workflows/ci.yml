name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest 1.27 patch (not the go.mod minimum) so govulncheck sees stdlib fixes.
          go-version: '1.27.x'
          check-latest: true
      - name: installer regression checks
        run: sh -n install.sh && python3 tools/test-install.py
      - name: build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        # Full admin fixtures use production Argon2 with race + cross-package coverage.
        # Allow cumulative suite time on hosted runners; retain a finite package timeout.
        run: go test -timeout=20m -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage (80% across unit and integration tests)
        run: |
          go tool cover -func=coverage.out > coverage-summary.txt
          awk '$1 == "total:" { found = 1; sub(/%$/, "", $3); if ($3 + 0 < 80) exit 1 } END { if (!found) exit 1 }' coverage-summary.txt
      - name: staticcheck
        # Pinned; checks and exclusions live in staticcheck.conf.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: check formatting
        run: test -z "$(gofmt -l cmd pkg internal examples tools web)"
      - name: default theme CSS is up to date
        # Pinned Tailwind standalone CLI, checksum verified (tools/tailwind/build.sh).
        run: tools/tailwind/build.sh --check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: canvas graph, preset and layout checks
        run: node --test web/admin/static/canvas_*_test.cjs
      - run: npm test -- --project=chromium --project=theme
        working-directory: e2e
        env:
          STRIPE_SECRET_KEY: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-report
          path: e2e/playwright-report/
