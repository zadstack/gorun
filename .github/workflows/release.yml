name: release

# Runs on version tags (v0.1.0, v1.2.3, v1.0.0-rc.1). Builds and pushes the
# multi-arch image to ghcr.io/zadstack/gorun, builds binary archives with
# checksums, and creates the GitHub release with notes from CHANGELOG.md.
# Pull requests that touch the image or this workflow build everything
# without pushing or releasing, so a broken release is caught before tagging.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - deploy/Dockerfile
      - .github/workflows/release.yml
      - tools/package-release.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zadstack/gorun

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0, 0.1 and latest; pre-releases (v1.0.0-rc.1) get only their own tag.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=GoRun
            org.opencontainers.image.description=Self-hosted CMS in Go and SQLite: bilingual admin, page builder, canvases, REST and MCP.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/deploy/coolify.md
          annotations: |
            org.opencontainers.image.description=Self-hosted CMS in Go and SQLite: bilingual admin, page builder, canvases, REST and MCP.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: verify the pushed image reports the version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "$platform" "$IMAGE:$VERSION" >/dev/null
          done
          got=$(docker run --rm --platform linux/amd64 --entrypoint /app/gorun "$IMAGE:$VERSION" version)
          echo "gorun version: $got"
          case "$got" in *"$VERSION"*) ;; *) echo "expected $VERSION"; exit 1 ;; esac

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build archives and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then version="pr-${{ github.event.number }}"; fi
          python3 tools/package-release.py --version "$version" --output dist \
            --target linux/amd64 --target linux/arm64 --target darwin/amd64 --target darwin/arm64
          ls -l dist
      - name: release index for staged updates
        # Lists every migration this commit ships so Operations → System updates
        # can refuse a target that does not know the live data. A pull request
        # builds a 0.0.0-pr.N pre-release only to prove the step works.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then version="0.0.0-pr.${{ github.event.number }}"; fi
          go build -trimpath -ldflags "-X main.version=$version" -o "$RUNNER_TEMP/gorun-index" ./cmd/gorun
          set --
          while read -r sum file; do
            set -- "$@" --artifact "$file=sha256:$sum"
          done < "$(ls dist/SHA256SUMS-*.txt)"
          "$RUNNER_TEMP/gorun-index" release-index "$@" > dist/release-index.json
          python3 - dist/release-index.json "$version" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          rel = doc["releases"][0]
          assert doc["latest"] == rel["version"] == sys.argv[2], doc["latest"]
          assert len(rel["artifacts"]) == 4 and rel["migrations"], rel
          print(len(rel["migrations"]), "migrations,", len(rel["artifacts"]), "archives")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: [image, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no [$version] section"; exit 1; fi
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$version"
            echo '```'
            echo
            echo "Multi-arch (linux/amd64, linux/arm64). Binary archives below include the themes; verify them with the SHA256SUMS file."
          } >> notes.md
      - name: add the pushed image to the release index
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "image digest missing: $DIGEST"; exit 1 ;; esac
          jq --arg id "$IMAGE:$version" --arg digest "$DIGEST" \
            '.releases[0].artifacts = [{id: $id, digest: $digest}] + .releases[0].artifacts' \
            dist/release-index.json > release-index.json
          mv release-index.json dist/release-index.json
          jq -r '.releases[0].artifacts[].id' dist/release-index.json
      - name: create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
              --title "GoRun ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
      - name: test the published README in a clean Linux container
        env:
          SMOKE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm -e SMOKE_TAG -v "$PWD:/checks:ro" debian:bookworm-slim sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates curl python3
            su -s /bin/sh nobody -c "python3 /checks/tools/smoke-install.py"
          '
