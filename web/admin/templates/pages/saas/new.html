{{define "title"}}{{t "saas.ui.new_title"}}{{end}}
{{define "content"}}<div class="module-workspace max-w-3xl"><a href="/admin/saas">{{t "saas.ui.back"}}</a><h1 class="text-xl font-semibold mt-3">{{t "saas.ui.new_title"}}</h1><p class="text-muted mt-2">{{t "saas.ui.help"}}</p><details {{if not .Apps}}open{{end}}><summary>{{t "saas.ui.step1"}}</summary><form method="post" action="/admin/saas/apps"><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="request_key" value="{{.AppKey}}"><input type="hidden" name="next" value="subscription"><label>{{t "saas.ui.name"}}<input name="name" required maxlength="200"></label><label>slug<input name="slug" required pattern="[a-z0-9][a-z0-9-]{0,79}"></label><label>{{t "saas.ui.owner"}}<select name="owner_id" required>{{range .Owners}}<option value="{{.ID}}">{{.Name}} · {{.Email}}</option>{{end}}</select></label><label>{{t "saas.ui.optional_url"}}<input type="url" name="base_url"></label><button>{{t "saas.ui.create_app"}}</button></form></details>{{if .Apps}}<article id="subscription"><h2>{{t "saas.ui.step2"}}</h2><form method="post" action="/admin/saas/subscriptions"><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="request_key" value="{{.SubKey}}"><label>{{t "saas.ui.app"}}<select name="app_id" required>{{range .Apps}}<option value="{{.ID}}" {{if eq .ID $.SelectedApp}}selected{{end}}>{{.Name}}</option>{{end}}</select></label><label>{{t "saas.ui.customer"}}<select name="owner_id" required>{{range .Owners}}<option value="{{.ID}}">{{.Name}} · {{.Email}}</option>{{end}}</select></label><label>{{t "saas.ui.plan"}}<input name="plan_id" required maxlength="100"></label><label>{{t "saas.ui.metric"}}<input name="metric" value="tasks" required></label><label>{{t "saas.ui.limit"}}<input type="number" min="0" name="limit" value="100" required></label><label>{{t "saas.ui.expires"}}<input name="valid_until" placeholder="2027-01-01T00:00:00Z"></label><button>{{t "saas.ui.create_sub"}}</button></form></article>{{else}}<p class="border border-line rounded p-4">{{t "saas.ui.need_app"}}</p>{{end}}</div>{{end}}
