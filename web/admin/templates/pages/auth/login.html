{{define "title"}}{{t "auth.login.title"}}{{end}}
{{define "content"}}
<div class="card admin-auth-panel">
  <header>
    <p class="admin-auth-brand">{{t "core.app.name"}}</p>
    <h1>{{t "auth.login.title"}}</h1>
  </header>
  <section>
    {{with .Error}}<div role="alert" class="alert mb-4" data-variant="destructive"><section>{{t .}}</section></div>{{end}}
    <form method="post" action="/admin/login" class="grid gap-4" novalidate>
      <input type="hidden" name="_csrf" value="{{csrf}}">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="field">
        <label for="email">{{t "auth.login.identity"}}</label>
        <input id="email" name="email" type="text" autocomplete="username" required value="{{.Email}}">
      </div>
      <div class="field">
        <label for="password">{{t "auth.field.password"}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn w-full">{{t "auth.login.submit"}}</button>
    </form>
    {{if .Recovery}}<div class="mt-4 grid gap-2 text-sm text-muted-foreground" data-login-recovery>
      <p>{{t "auth.login.recovery"}}</p>
      <code dir="ltr" class="block rounded border border-line bg-panel-2 px-2 py-1 font-mono text-xs break-all">gorun user password --data DATA-FOLDER --email YOUR-EMAIL --password-stdin</code>
    </div>{{end}}
  </section>
</div>
{{end}}
