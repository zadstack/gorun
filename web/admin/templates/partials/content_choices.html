{{/* Author or term <option>s for the bulk bar, the bulk step and the editor (content admin_choices.go). */}}
{{define "content/choice_options"}}{{if .Blank}}<option value="">{{t "content.editor.choose"}}</option>{{end}}{{range .Authors}}<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>{{end}}{{range .Terms}}<optgroup label="{{.Label}}">{{range .Options}}<option value="{{.Value}}">{{.Label}}</option>{{end}}</optgroup>{{end}}{{if .More}}<option value="" disabled>{{t "content.choices.more"}}</option>{{end}}{{if not (or .Authors .Terms)}}<option value="" disabled>{{t "content.choices.none"}}</option>{{end}}{{end}}
