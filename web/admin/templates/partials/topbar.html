{{define "partials/topbar"}}
<header class="admin-topbar h-14 border-b border-line bg-panel flex items-center gap-3 px-4">
  <button data-sidebar-toggle aria-controls="admin-sidebar" type="button" class="md:hidden p-1.5 rounded border border-line hover:border-line-strong focus:outline-none focus:ring-[3px] focus:ring-green-soft"
          @click="toggleSidebar()" :aria-expanded="sidebarOpen.toString()" aria-label="{{t "core.action.toggle_menu"}}">{{icon "menu"}}</button>
  {{/* Live search: HTMX loads /admin/x/search into the dropdown; without JS the form submits to /admin/search. "/" focuses, Esc closes. */}}
  <form role="search" class="admin-search-form relative flex-1 max-w-md" action="/admin/search" method="get"
        x-data="{ open: false }"
        @keydown.escape="open = false"
        @keydown.slash.window="if (!['INPUT', 'TEXTAREA', 'SELECT'].includes($event.target.tagName) && !$event.target.isContentEditable) { $event.preventDefault(); $refs.search.focus() }"
        @htmx:after-swap="open = true">
    <label class="sr-only" for="gp-search">{{t "core.search"}}</label>
    <input id="gp-search" name="q" type="search" placeholder="{{t "core.search"}}" autocomplete="off"
           x-ref="search" @focus="open = true" aria-controls="admin-search-results" aria-expanded="false" aria-keyshortcuts="/"
           hx-get="/admin/x/search" hx-trigger="input changed delay:300ms, focus" hx-target="#admin-search-results" hx-swap="innerHTML"
           class="w-full h-9 rounded border border-line bg-bg px-3 placeholder:text-muted focus:outline-none focus:border-green focus:ring-[3px] focus:ring-green-soft">
    <div id="admin-search-results" role="region" aria-label="{{t "core.search"}}" aria-live="polite"
         class="absolute inset-x-0 top-full mt-1 z-40 max-h-96 overflow-y-auto rounded border border-line bg-panel [&:not(:has(li)):not(:has(p))]:hidden [&[x-cloak]]:hidden"
         x-show="open" x-cloak @click.outside="if ($event.target !== $refs.search) open = false"></div>
  </form>
  <div class="admin-account-actions ms-auto flex items-center gap-2">
    <form method="post" action="/admin/locale">
      <input type="hidden" name="_csrf" value="{{csrf}}">
      <input type="hidden" name="locale" value="{{if eq locale "ar"}}en{{else}}ar{{end}}">
      <button type="submit" class="h-9 px-3 rounded border border-line hover:border-line-strong focus:outline-none focus:ring-[3px] focus:ring-green-soft">{{t "core.locale.switch"}}</button>
    </form>
    {{with user}}
    <span class="admin-account-name hidden sm:inline text-muted">{{.Name}}</span>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="_csrf" value="{{csrf}}">
      <button type="submit" class="h-9 px-3 rounded border border-line hover:border-line-strong inline-flex items-center gap-1.5 focus:outline-none focus:ring-[3px] focus:ring-green-soft">{{icon "log-out"}}<span>{{t "core.action.logout"}}</span></button>
    </form>
    {{end}}
  </div>
</header>
<script type="module" src="{{asset "search-position.js"}}"></script>
{{end}}
