<section class="ed-search"><p class="ed-eyebrow">{{t "ed.archive"}}</p><h1>{{t "search_results"}}</h1><form action="{{url "/search"}}" method="get" role="search"><label for="ed-search-q">{{t "search"}}</label><div><input id="ed-search-q" name="q" type="search" value="{{index .Query "q"}}" placeholder="{{t "search_placeholder"}}"><button type="submit">{{t "search"}} <span class="gr-ext-arrow" aria-hidden="true">↗</span></button></div></form>{{if index .Query "q"}}{{if .Items}}{{component "list-variant" .}}{{else}}<p class="ed-empty">{{t "no_results"}}</p>{{end}}{{else}}<p class="ed-empty">{{t "ed.search_note"}}</p>{{end}}</section>
