<article class="sb-card">{{with media .FeaturedMediaID}}<a class="sb-card-image" href="{{url $}}" tabindex="-1" aria-hidden="true">{{img . "medium" "sb-cover"}}</a>{{end}}<div class="sb-card-copy">{{with .PublishedAt}}<time datetime="{{.}}"><bdi>{{date .}}</bdi></time>{{end}}<h2><a href="{{url .}}">{{.Title}}</a></h2>{{with excerpt . 30}}<p>{{.}}</p>{{end}}<a class="sb-read" href="{{url .}}">{{t "read_more"}} <span class="gr-ext-arrow" aria-hidden="true">↗</span></a></div></article>
