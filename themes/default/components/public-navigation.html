{{/* Input: publicNavigation location. Flat top-level contextual menu, not an admin navigation. */}}
{{if .Links}}<nav class="gp-public-navigation" aria-label="{{.Label}}"><ul>{{range .Links}}<li><a href="{{.URL}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a></li>{{end}}</ul></nav>{{end}}
