{{/* Usage: {{component "list-rows" .}} — archive variant "compact": dense title rows with dates, then pagination. */}}
{{if .Items}}
<ol class="gr-list gr-list-compact" data-variant-list="compact">
  {{range .Items}}<li class="gr-list-row gr-list-row-compact"><h2 class="gr-list-title"><a class="title" href="{{url .}}">{{.Title}}</a></h2>{{with .PublishedAt}}<time datetime="{{.}}" class="gr-list-meta"><bdi>{{date .}}</bdi></time>{{end}}</li>{{end}}
</ol>
{{component "pagination" .}}
{{else}}{{component "list" .}}{{end}}
