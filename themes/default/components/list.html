{{/* Usage: {{component "list" .}} — numbered rows + pagination, or empty state. */}}
{{if .Items}}
<ol class="gr-list">
  {{range $i, $item := .Items}}{{component "list-row" (dict "Item" $item "Index" $i)}}{{end}}
</ol>
{{component "pagination" .}}
{{else}}
<p class="default-empty rounded border border-line bg-panel p-6 text-muted">{{t "empty"}}</p>
{{end}}
