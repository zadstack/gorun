{{/* Rendered on template errors; deliberately avoids menus and queries. */}}
<!doctype html>
<html lang="{{locale}}" dir="{{dir}}" data-theme="{{.Theme.Slug}}" data-kind="500">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{t "error_title"}} · {{.Site.Title}}</title>
<link rel="stylesheet" href="{{asset "tokens.css"}}">
<link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body class="gr-error-page">
  <h1>{{t "error_title"}}</h1>
  <p>{{t "error_body"}}</p>
  <p><a href="{{url "/"}}">{{t "back_home"}}</a></p>
</body>
</html>
