<article class="studio-card">{{with media .FeaturedMediaID}}<a href="{{url $}}" tabindex="-1" aria-hidden="true">{{img . "large" "studio-card-image"}}</a>{{end}}<div>{{with .PublishedAt}}<p class="studio-kicker"><time datetime="{{.}}">{{date .}}</time></p>{{end}}<h2><a href="{{url .}}">{{.Title}}</a></h2>{{with excerpt . 30}}<p>{{.}}</p>{{end}}<a class="studio-read" href="{{url .}}">{{t "read_more"}} <span aria-hidden="true">↗</span></a></div></article>
