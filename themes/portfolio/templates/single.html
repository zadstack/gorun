{{part "header" .}}
{{with .Content}}<article class="studio-shell studio-article"><header>{{with .PublishedAt}}<p class="studio-kicker"><time datetime="{{.}}"><bdi>{{date .}}</bdi></time></p>{{end}}<h1>{{.Title}}</h1></header>{{with media .FeaturedMediaID}}<figure>{{img . "large" "studio-featured"}}{{with .Caption}}<figcaption>{{.}}</figcaption>{{end}}</figure>{{end}}<div class="prose-gp">{{safe .Body}}</div>{{component "comments" (dict "Item" . "Flash" $.Extra.comment_flash)}}</article>{{end}}
{{part "footer" .}}
