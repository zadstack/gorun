<circle cx="875" cy="112" r="10" fill="#1748ed"/>
<text x="875" y="174" class="ink" font-size="36" font-weight="600" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >السياق</text>
<text x="968" y="239" class="muted" font-size="33" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext" >تبقى النتيجة خاصة. النشر إجراء مستقل.</text>
</g></svg>
