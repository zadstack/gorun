<text x="117.0" y="139" class="ink" font-size="19" font-weight="650" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >القرار لك</text>
<text x="117.0" y="170" class="muted" font-size="13" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >النشر إجراء مستقل</text>
<path d="M208 153h24 M214 148l-5 5 5 5" fill="none" stroke="#1748ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="341.0" y="84" class="muted" font-size="12" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >٣ · تستلم</text>
<rect x="238" y="102" width="206" height="106" rx="10" fill="#fff" stroke="#dce2e8"/>
<text x="341.0" y="139" class="ink" font-size="19" font-weight="650" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >نتيجة خاصة</text>
<text x="341.0" y="170" class="muted" font-size="13" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >تُضاف كملاحظة جديدة</text>
<path d="M450 153h24 M456 148l-5 5 5 5" fill="none" stroke="#1748ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="589.0" y="84" class="muted" font-size="12" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >٢ · تشغّل</text>
<rect x="480" y="102" width="218" height="106" rx="10" fill="#fff" stroke="#dce2e8"/>
<text x="589.0" y="139" class="ink" font-size="19" font-weight="650" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >وكيل متصل</text>
<text x="589.0" y="170" class="muted" font-size="13" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >مزوّد مُعدّ أو</text>
<text x="589.0" y="188" class="muted" font-size="13" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >عميل خارجي متصل</text>
<path d="M704 153h24 M710 148l-5 5 5 5" fill="none" stroke="#1748ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="851.0" y="84" class="muted" font-size="12" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >١ · تختار</text>
<rect x="734" y="102" width="234" height="106" rx="10" fill="#fff" stroke="#dce2e8"/>
<text x="851.0" y="139" class="ink" font-size="19" font-weight="650" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >السياق والتعليمات</text>
<text x="851.0" y="170" class="muted" font-size="13" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >وصول تمنحه صراحة</text>
<text x="968" y="245" class="muted" font-size="14" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext" >لا تُستبدل المصادر؛ تبقى النتيجة خاصة حتى تتخذ إجراءً مستقلًا.</text>
