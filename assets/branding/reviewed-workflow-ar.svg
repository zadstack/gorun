<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="title desc" lang="ar">
<title id="title">سير عمل واضح للمراجعة</title><desc id="desc">تختار السياق والتعليمات وتمنح الوصول، ثم يشغّل الوكيل المتصل الطلب. تصل النتيجة ملاحظة خاصة جديدة لمراجعتك؛ يظل النشر إجراء مستقلًا.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; } svg[lang="ar"] text { font-family: Tahoma, Arial, sans-serif; } .ink { fill: #080e14; } .muted { fill: #545e69; } .mobile { display: none; } @media (max-width: 600px) { .desktop { display: none; } .mobile { display: inline; } }</style>
<rect x=".5" y=".5" width="999" height="269" rx="14" fill="#f7f9fc" stroke="#dce2e8"/><g class="desktop">
<text x="968" y="42" class="ink" font-size="22" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext" >سير عمل واضح للمراجعة</text>
<text x="117.0" y="84" class="muted" font-size="12" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >٤ · تراجع</text>
