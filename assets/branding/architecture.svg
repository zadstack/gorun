<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How GoRun fits together</title><desc id="desc">Visitors, staff, integrations, AI agents and providers reach one gorun process through the public site, the admin, REST, MCP and webhooks. Inside, modules boot in a fixed order on shared kernel services: hooks, a durable jobs queue, the audit log, settings and translations. Data lives in one SQLite database and a data directory; themes, patterns and extensions load from folders; external providers are optional.</desc>
