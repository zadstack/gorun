<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">A reviewed content workflow</title><desc id="desc">Connect selected content and a prompt to an agent. The result is a new private note. A human reviews it separately before publishing content.</desc><rect width="1000" height="370" rx="12" fill="#f1f4f7"/><g fill="none" stroke="#bdc9db" stroke-width="2"><path d="M238 103h60v94h56M238 275h60v-78M622 197h52M848 197h56"/></g><g fill="#f9fafb" stroke="#dce2e8"><rect x="40" y="58" width="198" height="90" rx="8"/><rect x="40" y="230" width="198" height="90" rx="8"/><rect x="354" y="135" width="268" height="125" rx="8"/><rect x="674" y="147" width="174" height="102" rx="8"/></g><g font-family="Arial,sans-serif"><g fill="#545e69" font-size="13"><text x="62" y="87">YOU CHOOSE</text><text x="62" y="259">YOU WRITE</text><text x="376" y="165">SCOPED ACCESS · MCP / AI</text><text x="696" y="176">NEW PRIVATE NOTE</text></g><g fill="#080e14" font-size="23" font-weight="700"><text x="62" y="122">Content</text><text x="62" y="294">Prompt</text><text x="376" y="204">Connected agent</text><text x="696" y="212">Result</text></g><text x="376" y="236" fill="#545e69" font-size="14">Configured provider or external client</text><text x="867" y="267" fill="#080e14" font-size="17" font-weight="700">Your review</text><text x="754" y="333" fill="#545e69" font-size="13">Publishing remains a separate action.</text></g><circle cx="927" cy="197" r="28" fill="#1748ed"/><path d="m914 197 9 9 17-19" fill="none" stroke="#f9fafb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#1748ed"><circle cx="298" cy="197" r="5"/><circle cx="649" cy="197" r="5"/></g></svg>
