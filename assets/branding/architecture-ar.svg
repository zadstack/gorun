<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc" lang="ar" direction="rtl">
<title id="title">كيف تترابط أجزاء GoRun</title><desc id="desc">يصل الزوار والفريق والتكاملات ووكلاء الذكاء الاصطناعي والمزودون إلى عملية gorun واحدة عبر الموقع العام ولوحة الإدارة وREST وMCP والويب هوك. في الداخل تُقلع الوحدات بترتيب ثابت فوق خدمات نواة مشتركة: الخطافات وطابور المهام وسجل التدقيق والإعدادات والترجمة. تُحفظ البيانات في قاعدة SQLite واحدة ومجلد بيانات، وتُحمَّل القوالب والأنماط والإضافات من مجلدات، والمزودون الخارجيون اختياريون.</desc>
