<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">GoRun: your content, your team, your agents</title><desc id="desc">A source-available CMS with scoped agent access through MCP and REST. A route connects content, agents and human review.</desc><rect width="1200" height="630" fill="#f9fafb"/><g fill="none" stroke="#dce2e8" stroke-width="1"><path d="M840-100v830M940-100v830M1040-100v830M1140-100v830M-100 120h1400M-100 520h1400"/><path d="M760-100c-250 400 450 400 250 830" stroke="#e4eaf3" stroke-width="80"/></g><g transform="translate(64 56) scale(.7)"><g fill="none" stroke="#1748ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M61 24H32a16 16 0 0 0-16 16v24a16 16 0 0 0 16 16h28a16 16 0 0 0 16-16V48H47"/><path d="M35 16h29a16 16 0 0 1 16 16v5"/></g><circle cx="47" cy="48" r="6" fill="#080e14"/><text x="112" y="68" font-family="Arial,sans-serif" fill="#080e14" font-size="62" font-weight="700" letter-spacing="-3">GoRun</text></g><g font-family="Arial,sans-serif" fill="#080e14"><text x="76" y="250" font-size="70" font-weight="700" letter-spacing="-3">Your content.</text><text x="76" y="335" font-size="70" font-weight="700" letter-spacing="-3">Your team. Your agents.</text><text x="80" y="390" font-size="23" fill="#545e69">Build a website. Connect your agents. Review before publishing.</text><text x="80" y="540" font-size="18" fill="#545e69">Single Go binary + SQLite</text><text x="390" y="540" font-size="18" fill="#545e69">MCP + REST API</text><text x="670" y="540" font-size="18" fill="#545e69">English + العربية</text></g><path d="M806 85h230v80H878v62h190" fill="none" stroke="#1748ed" stroke-width="3"/><circle cx="806" cy="85" r="6" fill="#1748ed"/><circle cx="1068" cy="227" r="6" fill="#080e14"/></svg>
