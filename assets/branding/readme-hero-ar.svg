<title id="title">GoRun — محتواك وفريقك ووكلاؤك، على بنيتك التحتية</title><desc id="desc">ملف Go واحد وقاعدة SQLite، مع إدارة بالعربية والإنجليزية وواجهتي MCP وREST. يربط Core المحتوى والقوالب والوكلاء. الرسم مكتمل دون حركة؛ يظهر خط تزييني مرة واحدة فقط عند السماح بالحركة.</desc>
